<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">Company Brain: from a request to reusable experience</title>
  <desc id="desc">A conceptual layered diagram. A human request connects to project context, a suitable workflow, checked work and retained experience. The control room makes reported actions, sources and outcomes visible. The diagram links to source documentation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172d3c"/><stop offset="1" stop-color="#0b1a27"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#31505e" stop-opacity=".95"/><stop offset="1" stop-color="#173747" stop-opacity=".85"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#a6edd6"/><stop offset="1" stop-color="#53bda9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7397a2" stroke-opacity=".08"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#020a12" flood-opacity=".5"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#8cd9c7" stroke-width="1.4"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.small{font-size:14px;letter-spacing:2px}.body{font-size:18px}.heading{font-size:25px;font-weight:600}.muted{fill:#a9bfca}a:focus path,a:hover path{stroke:#b0ffe3}</style>
  </defs>
  <rect width="1040" height="700" rx="22" fill="url(#bg)"/>
  <rect width="1040" height="700" rx="22" fill="url(#grid)"/>
  <text x="42" y="51" fill="#a6edd6" class="small">COMPANY BRAIN / CONCEPTUAL SYSTEM VIEW</text>
  <text x="42" y="88" fill="#f5f2e9" font-size="22">Your context becomes a better starting point.</text>
