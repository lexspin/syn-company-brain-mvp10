<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 300" width="1160" height="300" role="img" aria-labelledby="title desc">
<title id="title">Illustrative contribution economics</title><desc id="desc">Bars share a linear scale in pounds per customer-month. Revenue £530 comprises subscription £250, usage £80 and service work £200. Cost £230 comprises cloud £80, three delivery/support hours at £40 and other cost £30. Contribution is £300. Six hours instead of three raise cost to £350 and reduce contribution to £180. Illustrative assumptions, not a tariff or forecast.</desc>
<style>text{font-family:Arial,sans-serif}a:focus{outline:3px solid #087f83;outline-offset:4px}a:hover .interactive{fill:#d9eceb}.linked{text-decoration:underline}</style>
<rect width="1160" height="300" fill="#f7fafb"/>
<text x="24" y="38" fill="#153647" font-size="30" font-weight="600" text-anchor="start"><tspan x="24" dy="0">£530 revenue − £230 variable cost = £300 contribution</tspan></text><text x="24" y="70" fill="#546b78" font-size="21" font-weight="400" text-anchor="start"><tspan x="24" dy="0">One illustrative customer-month · before fixed overhead · common £ scale below</tspan></text><text x="24" y="116" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="24" dy="0">Revenue</tspan></text><rect x="279" y="93" width="715.5" height="30" rx="2" fill="#e8edef"/><rect x="279" y="93" width="715.5" height="30" rx="2" fill="#087f83"/><text x="1007.5" y="116" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="1007.5" dy="0">£530</tspan></text><text x="24" y="163" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="24" dy="0">Variable cost</tspan></text><rect x="279" y="140" width="715.5" height="30" rx="2" fill="#e8edef"/><rect x="279" y="140" width="310.5" height="30" rx="2" fill="#385a74"/><text x="602.5" y="163" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="602.5" dy="0">£230</tspan></text><text x="24" y="210" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="24" dy="0">Contribution</tspan></text><rect x="279" y="187" width="715.5" height="30" rx="2" fill="#e8edef"/><rect x="279" y="187" width="405.0" height="30" rx="2" fill="#087f83"/><text x="697.0" y="210" fill="#153647" font-size="23" font-weight="600" text-anchor="start"><tspan x="697.0" dy="0">£300</tspan></text><text x="24" y="252" fill="#153647" font-size="22" font-weight="400" text-anchor="start"><tspan x="24" dy="0">At 6 delivery/support hours: £530 − £350 = £180 contribution (hours cost £40 each).</tspan></text><a href="../SYN-BUSINESS-PLAN.html#economics" xlink:href="../SYN-BUSINESS-PLAN.html#economics" target="_top" aria-label="Read the complete illustrative economic model"><text x="24" y="284" fill="#087f83" font-size="21" font-weight="400" text-anchor="start"><tspan x="24" dy="0">See the revenue, cost and support assumptions ↗</tspan></text></a>
</svg>