<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 494" width="1160" height="494" role="img" aria-labelledby="title desc">
<title id="title">Standards and behaviour: historical intervals</title><desc id="desc">A common calendar axis shows the 1974 TCP paper to the 1983 ARPANET TCP/IP transition; the 1989 Web proposal to the 1993 public-domain release; the 1987 GSM agreement to a 2007 global mass-market account; and 2005 to 2015 US adult social-media use. These endpoints measure different things and do not establish comparable adoption speeds.</desc>
