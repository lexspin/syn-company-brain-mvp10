<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 255" width="1160" height="255" role="img" aria-labelledby="title desc">
<title id="title">SYN’s conditional development path</title><desc id="desc">MVP personal continuity, V1 team coordination and V2 cooperative service. Unlocking gates are reliable recall and recovery, permissioned team use, then interoperability, trust and viable member economics. Arrows express dependencies, not release dates.</desc>
<style>text{font-family:Arial,sans-serif}a:focus{outline:3px solid #087f83;outline-offset:4px}a:hover .interactive{fill:#d9eceb}.linked{text-decoration:underline}</style>
<rect width="1160" height="255" fill="#f7fafb"/>
<a href="../SYN-BUSINESS-PLAN.html#s3" xlink:href="../SYN-BUSINESS-PLAN.html#s3" target="_top" aria-label="Read MVP · Personal continuity and its development dependencies"><rect class="interactive" x="20" y="15" width="326" height="201" rx="7" fill="#e4f0ef"/><text x="37" y="52" fill="#087f83" font-size="24" font-weight="600" text-anchor="start"><tspan x="37" dy="0">MVP · Personal continuity</tspan></text><text x="37" y="90" fill="#153647" font-size="22" font-weight="400" text-anchor="start"><tspan x="37" dy="0">Remember context.</tspan><tspan x="37" dy="28">Reuse accepted methods.</tspan></text><path d="M37 139 H329" stroke="#c6d5dc"/><text x="37" y="169" fill="#153647" font-size="21" font-weight="400" text-anchor="start"><tspan x="37" dy="0">Gate: reliable recall, recovery</tspan><tspan x="37" dy="27">and repeated customer value.</tspan></text></a><a href="../SYN-BUSINESS-PLAN.html#s3" xlink:href="../SYN-BUSINESS-PLAN.html#s3" target="_top" aria-label="Read V1 · Team coordination and its development dependencies"><rect class="interactive" x="417" y="15" width="326" height="201" rx="7" fill="#e4f0ef"/><text x="434" y="52" fill="#087f83" font-size="24" font-weight="600" text-anchor="start"><tspan x="434" dy="0">V1 · Team coordination</tspan></text><text x="434" y="90" fill="#153647" font-size="22" font-weight="400" text-anchor="start"><tspan x="434" dy="0">Connect people and projects.</tspan><tspan x="434" dy="28">Share authorised context.</tspan></text><path d="M434 139 H726" stroke="#c6d5dc"/><text x="434" y="169" fill="#153647" font-size="21" font-weight="400" text-anchor="start"><tspan x="434" dy="0">Gate: governed identities,</tspan><tspan x="434" dy="27">permissions and team use.</tspan></text></a><a href="../SYN-BUSINESS-PLAN.html#s3" xlink:href="../SYN-BUSINESS-PLAN.html#s3" target="_top" aria-label="Read V2 · Cooperative service and its development dependencies"><rect class="interactive" x="814" y="15" width="326" height="201" rx="7" fill="#e4f0ef"/><text x="831" y="52" fill="#087f83" font-size="24" font-weight="600" text-anchor="start"><tspan x="831" dy="0">V2 · Cooperative service</tspan></text><text x="831" y="90" fill="#153647" font-size="22" font-weight="400" text-anchor="start"><tspan x="831" dy="0">Connect skills and businesses.</tspan><tspan x="831" dy="28">Coordinate agreed work.</tspan></text><path d="M831 139 H1123" stroke="#c6d5dc"/><text x="831" y="169" fill="#153647" font-size="21" font-weight="400" text-anchor="start"><tspan x="831" dy="0">Gate: interoperability, trust</tspan><tspan x="831" dy="27">and viable member economics.</tspan></text></a><path d="M357 113 H403 M394 105 L403 113 L394 121" stroke="#087f83" stroke-width="2.5" fill="none"/><path d="M754 113 H800 M791 105 L800 113 L791 121" stroke="#087f83" stroke-width="2.5" fill="none"/><a href="../SYN-BUSINESS-PLAN.html#s8" xlink:href="../SYN-BUSINESS-PLAN.html#s8" target="_top" aria-label="Read the enabling dependency profiles"><text x="20" y="248" fill="#546b78" font-size="23" font-weight="400" text-anchor="start"><tspan x="20" dy="0">Conditional progression · standards, customer behaviour and evidence determine the route ↗</tspan></text></a>
