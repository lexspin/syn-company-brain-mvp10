<header><div><h1>Company Brain <small>MVP01</small></h1><p>Your team, knowledge and work in one place · Open Creative Studio ↗</p></div><div><span id="health" class="tag">Connecting</span><p id="counts" class="muted"></p><small id="viewTime"></small></div></header>

<script>
window.prepareCompanyBrainGraph=function(graph){if(localStorage.getItem('brain-map-details')==='yes')return graph;const nodes=graph.nodes.filter(n=>!n.audit_only),ids=new Set(nodes.map(n=>n.id)),links=graph.links.filter(e=>ids.has(e.s)&&ids.has(e.t)),counts={},layers={};for(const n of nodes){counts[n.kind]=(counts[n.kind]||0)+1;layers[n.layer]=(layers[n.layer]||0)+1}Object.assign(counts,{nodes:nodes.length,links:links.length,run:nodes.filter(n=>n.kind==='run').length});return {...graph,nodes,links,counts,layers,areas:[...new Set(nodes.map(n=>n.area))].sort()};};
(()=>{
const token='__TOKEN__',W=document.getElementById('workspace');document.body.prepend(W);
const V=document.getElementById('workspaceView'),N=document.getElementById('notice');let state=null,tab=localStorage.getItem('brain-tab')||'Overview',editing=null,runId=null,chatBusy=false,runsSignature="",improvementBusy=false,lastChatTrace=null,graphView=null;
let session=localStorage.getItem('brain-session')||'main';let chosenAgent=localStorage.getItem('brain-agent')||'coordinator';let chosenProject=localStorage.getItem('brain-project')||'';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabLabels={'Overview':'Overview','Projects':'Projects','Chat':'Chat','Agents':'Team','Skills':'Playbooks','Memory':'Knowledge','Loops':'Workflows','Runs':'Results','Improvements':'Improvements','Stack & Git':'Workspace','Graph':'Map'};
const workingProfiles={light:{label:'Lightweight',model:'gpt-6-luna',reasoning_effort:'low'},routine:{label:'Routine',model:'gpt-6.1-sol',reasoning_effort:'medium'},thinking:{label:'Thinking',model:'gpt-6-astra',reasoning_effort:'medium'},innovation:{label:'Innovation',model:'gpt-6-astra',reasoning_effort:'ultra'}};
function workingProfile(data){return workingProfiles[data.model_profile]?data.model_profile:data.model==='gpt-6-luna'?'light':data.model==='gpt-6-astra'?(data.reasoning_effort==='ultra'?'innovation':'thinking'):'routine';}
function workingProfileFields(id){const profile=workingProfiles[id];if(!profile)throw Error('Choose a working profile.');return {model_profile:id,model:profile.model,reasoning_effort:profile.reasoning_effort,service_tier:'default'};}
const tabsByKind={project:'Projects',agent:'Agents',skill:'Skills',memory:'Memory',loop:'Loops',stack:'Stack & Git',run:'Runs'};
const routePattern=/^#(agent|skill|memory|loop|stack|project|run)\/([A-Za-z0-9_-]+)(?:\?version=(\d+))?$/;
function recordLink(kind,id,label,version){const known=kind==='run'?state?.runs.some(r=>r.id===id):state?.objects.some(o=>o.kind===kind&&o.id===id);return known?`<a href="#${kind}/${encodeURIComponent(id)}${version?'?version='+Number(version):''}">${esc(label||kind+':'+id)}</a>`:esc(label||kind+':'+id);}
function displayName(record,fallback='Saved record'){return record?.display_name||record?.data?.name||fallback;}
function webLink(url,label){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return esc(label||url);return `${esc(label||url)}`}catch{return esc(label||url)}}
function linkedText(value){const text=String(value??''),tokens=/\[[^\]\n]+\]\(https?:\/\/[^\s<>"']+\)|\[?(?:memory:)?[A-Za-z0-9_-]+@v?\d+\]?|\b(?:agent|skill|memory|loop|stack|project|run):[A-Za-z0-9_-]+|https?:\/\/[^\s<>"']+/g;let result='',pos=0;for(const match of text.matchAll(tokens)){result+=esc(text.slice(pos,match.index));const token=match[0],md=token.match(/^\[([^\]]+)\]\((https?:\/\/.+)\)$/),citation=token.match(/^\[?(?:memory:)?([A-Za-z0-9_-]+)@v?(\d+)\]?$/),ref=token.match(/^(agent|skill|memory|loop|stack|project|run):([A-Za-z0-9_-]+)$/);if(md)result+=webLink(md[2],md[1]);else if(citation)result+=recordLink('memory',citation[1],token,citation[2]);else if(ref)result+=recordLink(ref[1],ref[2],token);else{const url=token.replace(/[.,;:!?)}\]]+$/,'');result+=webLink(url)+esc(token.slice(url.length))}pos=match.index+token.length}return result+esc(text.slice(pos));}
function inlineText(text){const pattern=/`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__/g;let result='',position=0;for(const match of String(text).matchAll(pattern)){result+=linkedText(String(text).slice(position,match.index));result+=match[1]!==undefined?'<code>'+linkedText(match[1])+'</code>':'<strong>'+linkedText(match[2]||match[3])+'</strong>';position=match.index+match[0].length}return result+linkedText(String(text).slice(position));}
function richText(value){const lines=String(value??'').split(/\r?\n/);let html='',paragraph=[],list=[],code=null;const flush=()=>{if(paragraph.length){html+='<p>'+paragraph.map(inlineText).join('<br>')+'</p>';paragraph=[]}if(list.length){html+='<ul>'+list.map(x=>'<li>'+inlineText(x)+'</li>').join('')+'</ul>';list=[]}};for(const line of lines){if(line.trim().startsWith('```')){flush();if(code===null)code=[];else{html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=null}continue}if(code!==null){code.push(line);continue}const heading=line.match(/^#{1,6}\s+(.+)$/),item=line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)$/);if(heading){flush();html+='<h3>'+inlineText(heading[1])+'</h3>'}else if(item){if(paragraph.length)flush();list.push(item[1])}else if(!line.trim()){flush()}else{if(list.length)flush();paragraph.push(line)}}flush();if(code!==null)html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';return html;}
function freshness(record){return state.memory_freshness?.[record.id];}
function knowledgeLabel(record){const f=freshness(record);return record.archived?'Archived':record.data.status==='accepted'&&f&&!f.current?'Needs review':record.data.status==='accepted'?'In your library':'Candidate';}
function knowledgeNotice(record){const f=freshness(record);return record.data.status==='accepted'&&f&&!f.current?`<details><summary class="danger">Needs review before reuse</summary><p>This knowledge is excluded from future answers until its changed sources are reviewed and corrected.</p><p>${esc(f.reason)}</p></details>`:'';}
function executiveForwardView(){const policy=state.objects.find(o=>o.kind==='memory'&&o.id==='executive-consensus-policy'&&!o.archived);if(!policy)return '';const directors=(policy.data.directors||[]).map(id=>state.objects.find(o=>o.kind==='agent'&&o.id===id&&!o.archived)).filter(Boolean),decisions=state.objects.filter(o=>o.kind==='memory'&&o.data.record_type==='executive-decision'&&!o.archived);return `<section class="cardx" style="margin-bottom:24px"><h2>Executive direction</h2><p>See the next decision, the directors involved, and what still needs evidence or agreement.</p><div class="row">${directors.map(d=>recordLink('agent',d.id,displayName(d))).join(' · ')}</div><p>${recordLink('memory',policy.id,'How agreement and decisions are recorded')} · ${recordLink('project','mvp01-upkeep','Workspace upkeep')}</p>${decisions.length?decisions.map(d=>`<div class="cardx"><h3>${recordLink('memory',d.id,displayName(d))}</h3><p>${esc(({proposal:'Proposed direction',aligned:'Explicitly aligned',disputed:'Differences to resolve',decided:'Owner decision recorded'})[d.data.decision_state]||'Review needed')}</p><p>${esc(d.data.next_action||'Next action not recorded.')}</p></div>`).join(''):'<p>No director consensus or owner decision has been recorded for the current production yet. A prepared scene remains a proposal until it is reviewed.</p>'}</section>`;}
function resultsSignature(){return JSON.stringify([state.runs,state.objects,state.memory_freshness]);}
function recentOutcomes(){const native=state.objects.filter(o=>o.kind==='memory'&&!o.archived&&o.data.type==='native-work-request'&&o.data.request_state==='completed').map(o=>({request:o,result:state.objects.find(r=>r.kind==='memory'&&!r.archived&&r.id===o.data.result_ref)})).filter(x=>x.result&&state.memory_freshness?.[x.result.id]?.current!==false).map(x=>({date:x.request.updated||'',html:`<article class="cardx"><h3>${recordLink('memory',x.result.id,displayName(x.result))}</h3><span class="tag">Recorded native result</span><p>${recordLink('memory',x.request.id,'Request and checks')}</p></article>`}));const runs=state.runs.filter(r=>r.context_current!==false&&['completed','accepted','needs_review'].includes(r.state)).map(r=>({date:r.created||'',html:`<article class="cardx"><h3>${recordLink('run',r.id,displayName(state.objects.find(o=>o.kind==='loop'&&o.id===r.loop_id),r.loop_id))}</h3><span class="tag">${esc(resultLabel(r))}</span><p>${r.step} steps saved</p></article>`}));const recent=[...native,...runs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return recent.length?'<div class="cards">'+recent.map(x=>x.html).join('')+'</div>':'<p>No current outputs are available here. Open Results for queued work and earlier history.</p>';}
function overviewView(){const areas=[['Projects','Your projects',objs('project').length+' registered project folders.'],['Chat','Start a conversation','Describe an outcome and work with your team.'],['Agents','Your team',objs('agent').length+' active roles, with clear ownership and scope.'],['Skills','Your playbooks',objs('skill').length+' reusable procedures.'],['Memory','Your knowledge',objs('memory').length+' saved source and decision records.'],['Loops','Your workflows',objs('loop').length+' configured workflows.'],['Improvements','Improve how work gets done','Turn corrections into reviewed playbook changes.']];V.innerHTML=executiveForwardView()+`<h2>Your Company Brain</h2><p>Bring an outcome, find its evidence, and review the work your team prepares.</p><div class="cards">${areas.map(([target,title,description])=>`<article class="cardx"><h3>${title}</h3><p>${description}</p><button data-home-tab="${target}">Open ${tabLabels[target].toLowerCase()}</button></article>`).join('')}</div><h2 style="margin-top:28px">Recent outcomes</h2>${recentOutcomes()}`;document.querySelectorAll('[data-home-tab]').forEach(button=>button.onclick=()=>document.querySelector('[data-tab="'+button.dataset.homeTab+'"]').click());}
function globalSearch(){if(!state)return;const query=document.getElementById('globalSearch').value.trim().toLowerCase(),box=document.getElementById('globalResults');if(!query){box.innerHTML='';return}const matches=state.objects.filter(o=>(displayName(o)+' '+o.id+' '+JSON.stringify(o.data)).toLowerCase().includes(query)).slice(0,40),runs=state.runs.filter(r=>(r.loop_id+' '+r.state+' '+r.id).toLowerCase().includes(query)).slice(0,10);box.innerHTML=`<section class="editor"><div class="row"><h3>Search results</h3><button id="closeGlobalResults">Close search</button></div>${matches.map(o=>`<p>${recordLink(o.kind,o.id,displayName(o))} <small>· ${esc(tabLabels[tabsByKind[o.kind]]||o.kind)}${o.kind==='memory'?' · '+knowledgeLabel(o):o.archived?' · Archived':''}</small></p>`).join('')}${runs.map(r=>`<p>${recordLink('run',r.id,r.loop_id)} · ${esc(resultLabel(r))}</p>`).join('')}${!matches.length&&!runs.length?'<p>No matching items.</p>':''}</section>`;document.getElementById('closeGlobalResults').onclick=()=>box.innerHTML='';}
function resultLabel(run){return run.context_current===false?'Sources changed — previous result':resultState(run.state);}
function resultState(value){return ({completed:'Reviewed draft saved',needs_review:'Ready for your review',accepted:'Accepted',running:'In progress',queued:'Waiting to start',failed:'Needs attention',cancelled:'Stopped',interrupted:'Interrupted',cancelling:'Stopping'})[value]||value;}
document.getElementById('searchEverything').onclick=globalSearch;document.getElementById('globalSearch').onkeydown=event=>{if(event.key==='Enter')globalSearch()};
function relatedLinks(record){const d=record.data,refs=new Set(d.refs||[]);if(record.kind==='agent'){if(d.parent)refs.add('agent:'+d.parent);(d.skills||[]).forEach(s=>refs.add('skill:'+s))}if(record.kind==='loop')(d.steps||[]).forEach(s=>{refs.add('agent:'+s.agent);if(s.skill)refs.add('skill:'+s.skill)});return refs.size?`<div class="record-links">${[...refs].map(r=>{const [kind,id]=r.split(':');return recordLink(kind,id,displayName(state.objects.find(o=>o.kind===kind&&o.id===id),r))}).join(' · ')}</div>`:'';}
const objs=k=>state.objects.filter(o=>o.kind===k&&!o.archived);
const chatAgents=()=>objs('agent').filter(a=>a.id!=='prompt-engineer');
function provenanceValue(value){if(Array.isArray(value))return '<ul>'+value.map(v=>'<li>'+provenanceValue(v)+'</li>').join('')+'</ul>';if(value&&typeof value==='object'){if(value.url){const internal=String(value.url).replace(/^\//,'').match(routePattern);return internal?recordLink(internal[1],internal[2],value.label||value.title||value.url,internal[3]):webLink(value.url,value.label||value.title||value.url)}return Object.entries(value).map(([key,v])=>`<p><b>${esc(key.replaceAll('_',' '))}</b>: ${provenanceValue(v)}</p>`).join('')}const ref=String(value??'').match(/^(agent|skill|memory|loop|stack|project):([A-Za-z0-9_-]+)$/);return ref?recordLink(ref[1],ref[2],displayName(state.objects.find(o=>o.kind===ref[1]&&o.id===ref[2]),value)):linkedText(value);}
function provenance(record){const fields=['source','source_path','source_links','validation','dependencies','journal_refs','paper_refs'].filter(k=>record.data[k]!==undefined),captured=record.data.capture?.provenance;return fields.length||captured?`<details><summary>Source and review evidence</summary>${fields.map(k=>`<div><b>${esc(({source:'Recorded provenance',source_path:'Location',source_links:'Sources',journal_refs:'Journal references',paper_refs:'Paper references'})[k]||k.replaceAll('_',' '))}</b>${provenanceValue(record.data[k])}</div>`).join('')}${captured?'<div><b>Captured research sources</b>'+provenanceValue(captured)+'</div>':''}</details>`:'';}
function knowledgeSourceCategory(record){const d=record.data,path=String(d.source_path||d.capture?.provenance?.source_file||'').replaceAll('\\','/').toLowerCase();if(d.type==='l2-answer-cache')return 'Saved answer';if(d.type==='research-capture')return 'Captured research';if(path.includes('/directors/')||path.includes('/team workspaces/'))return 'Role reference';if(path.endsWith('/skill.md'))return 'Original playbook source';if(path.includes('/tech journal/'))return 'Technical journal';if(record.id?.startsWith('thesis-'))return 'Company Brain thesis source';if(path.endsWith('.docx')||path.endsWith('.pdf'))return 'Research document';if(path)return 'Imported source document';return 'Saved reference';}
function knowledgeSourceHtml(record){const d=record.data,urls=[...(d.capture?.provenance?.source_urls||[]),...(d.source_links||[]).filter(v=>typeof v?.url==='string'&&/^https?:\/\//i.test(v.url)).map(v=>v.url)];if(/^https?:\/\/[^\s]+$/.test(d.source||''))urls.push(d.source);const links=[...new Set(urls)].slice(0,5).map((url,index)=>webLink(url,urls.length===1?'Open source':'Source '+(index+1)));return esc(knowledgeSourceCategory(record))+(links.length?' · '+links.join(' · '):'');}

const option=(v,t,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`;
const field=(id,name,value='',type='input')=>`<label><span>${esc(name)}</span><${type} id="${id}" ${type==='input'?`value="${esc(value)}"`:''}>${type==='textarea'?esc(value):''}</${type}></label>`;
const val=id=>document.getElementById(id).value;
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Brain-Token':token},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||r.status);return x;}
function notify(text,error=false){N.textContent=text;N.style.color=error?'#f3b29e':'#b8dabe';}
async function safe(fn){try{await fn()}catch(e){notify(e.message,true)}}
async function refresh(){state=await api('/api/state');document.getElementById('health').textContent=state._view?.stale?'Showing last saved view':state.worker_busy?'Work in progress':'Connected locally';document.getElementById('counts').textContent=`${state.objects.filter(x=>!x.archived).length} saved items · ${state.runs.length} results`;document.getElementById('viewTime').textContent=state._view?'Updated '+new Date(state._view.asof).toLocaleString()+(state._view.stale?' · refresh is overdue':''):'';updateMapStatus();}

 if(kind==='memory'){
 document.getElementById('reindex').onclick=()=>safe(async()=>{const r=await api('/api/index',{});notify(`Index rebuilt: ${r.records} records.`)});
 document.getElementById('searchMemory').onclick=()=>safe(async()=>{const r=await api('/api/search',{query:val('memoryQuery')});document.getElementById('searchResults').innerHTML=r.map(o=>`<div class="message"><b>${recordLink('memory',o.id,displayName(o)+' · '+o.id+'@'+o.version,o.version)}</b><div>${linkedText(o.data.content.slice(0,1800))}</div></div>`).join('')||'<p>No accepted source matched.</p>'});}

async function loadRoutines(){const box=document.getElementById('routineBoard');if(!box)return;const view=await api('/api/routines');if(!box.isConnected)return;const routines=view.routines||[],lastPass=view.asof;box.innerHTML=`<h3>Local routines</h3><p>These run while this computer and its local service are awake.${lastPass?' Last pass: '+esc(new Date(lastPass).toLocaleString())+'.':''}</p><div class="cards">${routines.map(r=>{const last=(view.recent||[]).filter(e=>e.routine===r.id).at(-1),queued=(view.queued||[]).some(q=>q.routine===r.id);return `<article class="cardx"><h3>${esc(r.name)}</h3><p>${esc(r.schedule)} · ${esc(view.timezone||'Europe/London')} · ${r.enabled===false?'Paused':'Enabled'}</p>${last?`<p>Last recorded outcome: ${esc(last.status)}</p>`:'<p>No run recorded yet.</p>'}${queued?'<p>Waiting for the next local pass.</p>':''}<button data-routine-run="${esc(r.id)}" ${r.enabled===false||queued?'disabled':''}>Run now</button></article>`}).join('')||'<p>No local routines are registered.</p>'}</div><p>Saved morning briefings appear in Chat under the “briefs” conversation.</p>`;box.querySelectorAll('[data-routine-run]').forEach(button=>button.onclick=()=>safe(async()=>{button.disabled=true;try{await api('/api/routine-run',{id:button.dataset.routineRun,key:crypto.randomUUID()});notify('Queued for the next local pass, within five minutes while this computer is awake.');await loadRoutines()}catch(error){button.disabled=false;throw error}}));}

 const nameField=field('recordName','Name',d.name||''),identity=`<details><summary>Record identity and relationships</summary>${obj&&displayName(obj)!==d.name?'<p><b>Original source name</b><br>'+esc(d.name)+'</p>':''}${field('recordId','Record ID',obj?.id||'')}${field('recordRefs','Related record IDs',(d.refs||[]).join(', '))}</details>`;
 let html=`<section class="editor"><h3>${obj?esc(displayName(obj)):'Create '+esc(({project:'project',agent:'team role',skill:'playbook',memory:'knowledge record',loop:'workflow'})[kind]||kind)}</h3>${obj?relatedLinks(obj):''}`;

 else html+=nameField;
 if(kind==='project')html+=field('projectPath','Project folder',d.path||'')+field('projectScope','Scope',d.scope||'','textarea')+field('projectPurpose','Purpose',d.purpose||'','textarea');
 if(kind==='agent')html+=`<label><span>Hierarchy level</span><select id="agentLevel">${['director','manager','worker','specialist'].map(level=>option(level,level[0].toUpperCase()+level.slice(1),d.level||'specialist')).join('')}</select></label>`+field('agentScope','Scope',d.scope||'','textarea')+field('agentPurpose','Purpose',d.purpose||'','textarea')+`<label><span>Working profile</span><select id="workingProfile">${Object.entries(workingProfiles).map(([id,p])=>option(id,p.label,workingProfile(d))).join('')}</select></label><p>Lightweight for small tasks, Routine for everyday work, Thinking for deeper reasoning, Innovation for explicitly requested exploration.</p><label><span>Reports to</span><select id="parent">${option('','No parent role',d.parent||'')}${objs('agent').filter(a=>a.id!==obj?.id).map(a=>option(a.id,displayName(a),d.parent)).join('')}</select></label><details><summary>Advanced role settings</summary>`+field('instructions','Detailed instructions',d.instructions||'','textarea')+`<p>All working profiles use standard speed. The selected profile sets the model and reasoning level.</p>`+`<label><span>Attached playbooks</span></label>`+checks('attachedSkills',objs('skill').map(s=>[s.id,displayName(s)]),d.skills||[])+`<label><span>Available capabilities</span></label>`+checks('tools',state.tools.map(t=>[t,toolLabel(t)]),d.tools||[])+`</details>`;
 if(kind==='skill')html+=field('description','When to use this playbook',d.description||'')+`${['scope','purpose'].filter(k=>d[k]).map(k=>`<p><b>${esc(k)}</b><br>${linkedText(d[k])}</p>`).join('')}<details ${obj?'':'open'}><summary>Edit detailed playbook instructions</summary>`+field('instructions','Instructions',d.instructions||'','textarea')+`</details>${obj?provenance(obj):''}`;
 if(kind==='loop')html+=field('description','Intended outcome',d.description||'')+`<div id="steps"></div><button id="addStep">Add step</button><details><summary>Advanced workflow settings</summary><label><span>Maximum attempts per step</span><input type="number" id="attempts" min="1" max="3" value="${d.max_attempts||1}"></label><p>Steps run in order on this computer. Completed work waits for your review.</p></details>`;
 html+=identity+`<div class="row"><button class="primary" id="saveRecord">Save changes</button>${obj?`<button id="archiveRecord">${obj.archived?'Restore':'Archive'}</button>`:''}</div>${kind==='memory'?'</details>':''}<div class="row">${obj?'<button id="historyRecord">Version history</button>':''}<button id="closeEditor">Close</button></div><div id="versionHistory"></div></section>`;box.innerHTML=html;box.scrollIntoView({behavior:'smooth',block:'start'});
 if(obj)document.getElementById('recordId').disabled=true;
 if(kind==='loop'){(d.steps||[{tool:'retrieve',agent:'researcher',skill:'research-writer',instruction:''}]).forEach(addStep);document.getElementById('addStep').onclick=()=>addStep({});}
 document.getElementById('closeEditor').onclick=()=>{box.innerHTML='';history.replaceState(null,'',location.pathname+location.search)};
 document.getElementById('saveRecord').onclick=()=>safe(async()=>{let data={...d,name:val('recordName'),refs:val('recordRefs').split(',').map(s=>s.trim()).filter(Boolean)};

 if(kind==='agent')Object.assign(data,{level:val('agentLevel'),scope:val('agentScope'),purpose:val('agentPurpose'),instructions:val('instructions')||val('agentPurpose'),parent:val('parent'),...workingProfileFields(val('workingProfile')),skills:selected('attachedSkills'),tools:selected('tools')});
 if(kind==='skill')Object.assign(data,{instructions:val('instructions'),description:val('description')});

 const saved=await api('/api/save',{kind,id:val('recordId')||val('recordName').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),version:obj?.version||0,data,archived:!!obj?.archived});await refresh();history.replaceState(null,'',location.pathname+location.search);render();notify(saved.publication_warning||'Changes saved. Work using an earlier version will require review.',!!saved.publication_warning);});
 if(obj){document.getElementById('archiveRecord').onclick=()=>safe(async()=>{await api('/api/save',{kind,id:obj.id,version:obj.version,data:d,archived:!obj.archived});await refresh();history.replaceState(null,'',location.pathname+location.search);render();notify('Archive state saved; prior versions retained.');});document.getElementById('historyRecord').onclick=()=>safe(()=>versionHistory(kind,obj.id));}

function runsView(){
 runsSignature=resultsSignature();
 const history=state.runs.filter(r=>r.context_current===false);
 const current=state.runs.filter(r=>r.context_current!==false);
 const decisions=current.filter(r=>r.state==='needs_review');
 const active=current.filter(r=>['queued','running','cancelling'].includes(r.state));
 const finished=current.filter(r=>['completed','accepted'].includes(r.state));
 const stopped=current.filter(r=>!['needs_review','queued','running','cancelling','completed','accepted'].includes(r.state));
 const requests=state.objects.filter(o=>o.kind==='memory'&&!o.archived&&o.data.type==='native-work-request').sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
 const describe=r=>r.context_current===false
   ?'Earlier output kept as history. Its sources or procedure changed; it is not ready for current reuse. No decision is requested on this old version.'
   :r.state==='needs_review'?'A draft is ready. Read the output and its checks, then accept it only if it meets your intended outcome.'
   :r.state==='accepted'?'This output was accepted. Open it to use it or check its supporting evidence.'
   :r.state==='completed'?'The workflow saved a checked candidate. It is available to read, but has not become an approved fact.'
   :['queued','running','cancelling'].includes(r.state)?'Work is recorded as in progress. You do not need to act unless you want to stop it.'
   :'Work stopped before a usable result was confirmed. Inspect the recorded reason; this is not automatically an owner decision.';
 const card=r=>`<article class="cardx"><h3>${esc(displayName(state.objects.find(o=>o.kind==='loop'&&o.id===r.loop_id),r.loop_id))}</h3><span class="tag">${esc(r.context_current===false?'History · '+resultState(r.state):resultState(r.state))}</span><p>${esc(describe(r))}</p><p>${esc(new Date(r.created).toLocaleString('en-GB',{timeZone:'Europe/London'}))} London</p>${r.error?`<details><summary>Recorded outcome notes</summary><p>${esc(r.error)}</p></details>`:''}<button data-run="${r.id}">${r.context_current===false?'Inspect earlier output':r.state==='needs_review'?'Read draft and checks':'Open output and checks'}</button></article>`;
 const section=(title,items)=>items.length?`<section><h3>${title}</h3><div class="cards">${items.map(card).join('')}</div></section>`:'';
 const nativeCard=o=>{const d=o.data,result=state.objects.find(x=>x.kind==='memory'&&x.id===d.result_ref&&!x.archived);const done=d.request_state==='completed';return `<article class="cardx"><h3>${esc(displayName(result||state.objects.find(x=>x.kind==='loop'&&x.id===d.loop_id),d.name))}</h3><span class="tag">${esc(done?(result?'Recorded result available':'Result link needs checking'):d.request_state==='failed'?'Stopped':d.request_state==='running'?'In progress':'Waiting for Codex')}</span><p>${esc(done?'The native workflow recorded a result and completion evidence. Open it to see the actual findings.':d.request_state==='failed'?(d.failure_reason||'The request did not complete. Inspect its recorded reason.'):'The request is queued or owned by a worker. A request is not yet a finished result.')}</p>${result?recordLink('memory',result.id,'Read saved result'):''}<p>${recordLink('memory',o.id,'Request and evidence')}</p></article>`;};
 const nativeDone=requests.filter(o=>o.data.request_state==='completed');
 const nativePending=requests.filter(o=>['queued','running'].includes(o.data.request_state));
 const nativeStopped=requests.filter(o=>!['completed','queued','running'].includes(o.data.request_state));
 const nativeSection=(title,items)=>items.length?'<section><h3>'+title+'</h3><div class="cards">'+items.map(nativeCard).join('')+'</div></section>':'';
 const native=nativeSection('Saved native results',nativeDone)+nativeSection('Waiting or in progress',nativePending)+(nativeStopped.length?'<details id="nativeResultHistory"><summary>Stopped native requests · '+nativeStopped.length+'</summary><p>Retained failure reasons and evidence. These requests are not finished outputs.</p><div class="cards">'+nativeStopped.map(nativeCard).join('')+'</div></details>':'');
 V.innerHTML=`<h2>Results</h2><p>What was produced, what was checked, and what happens next.</p><section class="editor"><h3>${decisions.length?decisions.length+' draft(s) need your decision':'No current draft needs your decision'}</h3><p>${decisions.length?'Review the drafts below. Acceptance records your decision; it does not run the work again.':'Earlier runs and stopped work are kept below for reference. A technical status alone is not a request for you to intervene.'}</p></section>${section('Needs your decision',decisions)}${section('In progress',active)}${section('Available outputs',finished)}${native}${section('Stopped work',stopped)}${history.length?`<details id="resultHistory"><summary>Earlier runs · ${history.length} · sources changed</summary><p>These outputs retain their original checks and history. Open the owning workflow only if you need a fresh result. They are not current approval requests.</p><div class="cards">${history.map(card).join('')}</div></details>`:''}${!state.runs.length&&!requests.length?'<p>No outputs have been recorded yet. Start from a workflow or your native Codex chat.</p>':''}<div id="runDetail"></div>`;
 document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{const hash='#run/'+b.dataset.run;if(location.hash===hash)safe(followRoute);else location.hash=hash});

async function runDetail(){const selectedId=runId,r=await api('/api/run?id='+encodeURIComponent(selectedId));if(runId!==selectedId)return;const box=document.getElementById('runDetail');if(!box)return;box.innerHTML=`<section class="editor"><h3>${recordLink('loop',r.loop_id,displayName(state.objects.find(o=>o.kind==='loop'&&o.id===r.loop_id),r.loop_id))} · ${esc(resultLabel(r))}</h3>${r.context_current===false?`<p class="danger">The source material or playbook changed after this work was prepared. This result remains available as history. ${recordLink('loop',r.loop_id,'Open the workflow to prepare a current result.')}</p><details><summary>What changed</summary><p>${esc(r.context_note)}</p></details>`:''}${r.state==='completed'?`<p>Prepared and saved automatically as a candidate. ${recordLink('memory','candidate-'+r.id,'Open reviewed draft')} It is not an approved fact.</p>`:''}${r.error?`<details><summary class="danger">Why this needs attention</summary><p>${esc(r.error)}</p></details>`:''}<div class="row">${['queued','running','cancelling'].includes(r.state)?'<button data-command="cancel">Stop work</button>':''}${['failed','interrupted','cancelled'].includes(r.state)&&r.context_current!==false?'<button data-command="resume">Resume work</button>':''}${r.state==='needs_review'&&r.context_current!==false?'<button class="primary" data-command="accept">Accept reviewed result</button>':''}${r.state==='accepted'&&r.context_current!==false?'<button data-command="retain">Add accepted result to knowledge</button>':''}</div>${r.outputs.map(o=>`<details ${o.tool==='draft'?'open':''}><summary>Step ${o.step+1} · ${esc(toolLabel(o.tool))}</summary><div class="formatted">${richText(o.text)}</div>Open saved document<details><summary>Audit details</summary><p>Recorded check: ${esc(o.verification)}</p><small>SHA256 ${esc(o.sha256)}</small></details></details>`).join('')}<details><summary>Execution audit · ${r.attempts.length} attempts</summary><p>Run ${esc(r.id)}</p><pre>${esc(JSON.stringify(r.attempts.map(a=>({step:a.step,state:a.state,created:a.created,detail:a.state==='failed'?a.output:undefined})),null,2))}</pre></details></section>`;box.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>safe(async()=>{await api('/api/'+b.dataset.command,{id:runId});await refresh();runsView();notify('Result updated.');}));}

function improvementCard(record){const d=record.data,current=state.objects.find(o=>o.kind==='skill'&&o.id===d.skill_id),stale=!current||current.archived||current.version!==d.base_version;return `<article class="cardx"><h3>${esc(d.name||record.data.name)}</h3><span class="tag">${d.applied_version?'Applied':'Awaiting your review'}</span><p>Playbook: ${recordLink('skill',d.skill_id,displayName(current,d.skill_id))} · Proposal based on ${recordLink('skill',d.skill_id,'version '+d.base_version,d.base_version)}${current?' · Current version '+current.version:''}${d.applied_version?' · Applied version '+d.applied_version:''}</p><p><b>Your correction</b><br>${linkedText(d.feedback||'')}</p><div class="two"><details><summary>Previous instructions</summary><div class="formatted">${richText(d.before_instructions||'')}</div></details><details open><summary>Proposed instructions</summary><div class="formatted">${richText(d.proposed_instructions||d.content||'')}</div></details></div>${d.status!=='accepted'&&stale?'<p class="danger">This playbook changed after the proposal was prepared. Create a new proposal against its current version.</p>':''}${d.status!=='accepted'?`<button class="primary" data-apply-improvement="${esc(record.id)}" ${stale?'disabled':''}>Apply reviewed skill version</button>`:''}<details><summary>Review history and evidence</summary><p>${recordLink('memory',record.id,'Proposal record')} · ${esc(record.updated)}</p>${d.source_turn_id?`<p>Source conversation turn: ${esc(d.source_turn_id)}</p>`:''}<pre>${linkedText(JSON.stringify(d.validation||{},null,2))}</pre></details></article>`;}
function improvementsView(){const proposals=state.objects.filter(o=>o.kind==='memory'&&o.data.type==='skill-improvement'&&!o.archived).sort((a,b)=>b.updated.localeCompare(a.updated));V.innerHTML=`<h2>Improve a playbook</h2><p>Your corrections become proposals; only reviewed changes affect future work.</p><section class="editor"><label><span>Target playbook</span><select id="improvementSkill">${objs('skill').map(s=>option(s.id,displayName(s))).join('')}</select></label><label><span>What should change?</span><textarea id="improvementFeedback" placeholder="Describe what went wrong, what good looks like, and an example if you have one."></textarea></label><details><summary>Conversation context (optional)</summary><label><span>Source conversation</span><select id="improvementSession">${option('','Feedback only','')}${state.sessions.map(s=>option(s.session,s.session)).join('')}</select></label><p id="improvementTraceInfo">No conversation attached.</p></details><button class="primary" id="proposeImprovement" ${improvementBusy?'disabled':''}>${improvementBusy?'Preparing proposal…':'Generate skill proposal'}</button></section><h3>Proposals and applied changes</h3><div class="cards">${proposals.map(improvementCard).join('')||'<p>No proposals yet. Start with a correction above.</p>'}</div>`;
 document.getElementById('improvementSession').onchange=()=>safe(async()=>{const selected=val('improvementSession'),box=document.getElementById('improvementTraceInfo');if(!selected){box.textContent='No conversation attached.';return}const traces=await api('/api/chat-traces?session='+encodeURIComponent(selected));if(box.isConnected)box.textContent=traces[0]?'Latest saved turn: '+traces[0].id:'This conversation has no saved handoff yet.'});
 document.getElementById('proposeImprovement').onclick=()=>safe(async()=>{if(improvementBusy)return;const skill_id=val('improvementSkill'),feedback=val('improvementFeedback').trim(),sourceSession=val('improvementSession');if(!feedback)throw Error('Describe the correction before preparing a proposal.');improvementBusy=true;const button=document.getElementById('proposeImprovement');button.disabled=true;button.textContent='Preparing proposal…';try{const result=await api('/api/improvement-propose',{skill_id,feedback,session:sourceSession});await refresh();if(tab==='Improvements')improvementsView();notify('Proposal saved for your review. No playbook has changed.')}finally{improvementBusy=false;const current=document.getElementById('proposeImprovement');if(current){current.disabled=false;current.textContent='Generate skill proposal'}}});
 document.querySelectorAll('[data-apply-improvement]').forEach(button=>button.onclick=()=>safe(async()=>{button.disabled=true;try{const result=await api('/api/improvement-apply',{id:button.dataset.applyImprovement});await refresh();if(tab==='Improvements')improvementsView();notify('Reviewed change applied as playbook version '+result.data.applied_version+'. Previous versions remain available.')}finally{if(button.isConnected)button.disabled=false}}));
}
function stackView(){V.innerHTML=`<h2>Workspace</h2><p>Your changes are saved here. Keep a checkpoint, send it to your connected GitHub repository, or create a recovery copy.</p><section class="editor"><h3>Project connection</h3><div id="gitRepository">Checking connection…</div><div class="row"><button id="gitStatus">Refresh status</button><button id="gitSave" class="primary">Save checkpoint</button><button id="gitPush">Sync to GitHub</button><button id="backupBrain">Create backup</button></div><details><summary>Connection audit</summary><pre id="gitInfo"></pre></details></section><details><summary>Workspace setup and framework</summary><div class="cards">${objs('stack').map(o=>`<article class="cardx"><h3>${esc(displayName(o))}</h3>${Object.entries(o.data).filter(([k])=>!['name','refs'].includes(k)).map(([k,v])=>`<p><b>${esc(k)}</b><br>${linkedText(v)}</p>`).join('')}${relatedLinks(o)}</article>`).join('')}</div><p>The licensed V2 package, private conversations and generated documents stay outside Git. Backups preserve local working state.</p></details>`;document.getElementById('gitStatus').onclick=()=>safe(loadGit);document.getElementById('gitSave').onclick=()=>safe(async()=>{await api('/api/git-save',{});await loadGit();notify('Checkpoint saved locally.');});document.getElementById('gitPush').onclick=()=>safe(async()=>{const button=document.getElementById('gitPush');button.disabled=true;try{const result=await api('/api/git-push',{});await loadGit();notify(result.message||'Checkpoint sent to GitHub.')}finally{button.disabled=false}});document.getElementById('backupBrain').onclick=()=>safe(async()=>{const result=await api('/api/backup',{});notify('Recovery copy saved: '+result.path)});safe(loadGit);}
async function loadGit(){const status=await api('/api/git'),info=document.getElementById('gitInfo'),repository=document.getElementById('gitRepository');if(!info||!repository)return;info.textContent=JSON.stringify(status,null,2);const saved=status.status?'Local changes are waiting for a checkpoint.':status.head?'Latest local checkpoint: '+status.head:'No local checkpoint yet.',sync=Number.isInteger(status.ahead)?status.ahead===0?'No local checkpoints waiting to upload.':status.ahead+' local checkpoint(s) waiting to upload.':'';repository.innerHTML=`<p>${status.remote_url?webLink(status.remote_url,status.remote_url.replace('https://github.com/','')):'No remote repository is configured.'}</p><p>${esc(saved)}</p><p>${esc(sync)}${status.behind>0?' The last checked remote also contains '+status.behind+' newer checkpoint(s).':''}</p>${status.branch?`<small>Branch: ${esc(status.branch)} · Remote comparison uses the last observed GitHub state.</small>`:''}`;}

safe(async()=>{await refresh();if(!await followRoute())render();addGraphRecordLinks()});setInterval(()=>safe(async()=>{await refresh();if(tab==='Runs'&&resultsSignature()!==runsSignature)runsView()}),5000);
})();
</script>
