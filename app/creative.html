.production-steps{display:flex;gap:12px;flex-wrap:wrap;color:#c1d5a4;margin:0 0 24px}.production-steps span{padding:9px 14px;border:1px solid #3c4931;border-radius:24px;font-size:12px}.tracks-scroll{overflow:auto;margin:24px 0;border:1px solid var(--line);border-radius:12px}.track{display:flex;min-height:70px;border-bottom:1px solid var(--line)}.track>b{width:135px;flex-shrink:0;padding:22px 12px;background:#1b2118;font-size:12px}.track-lane{flex:1;position:relative;min-height:74px;background:repeating-linear-gradient(90deg,transparent,transparent 44px,#ffffff08 45px)}.track-lane button{position:absolute;top:8px;height:52px;overflow:hidden;text-align:left;padding:7px;border:2px solid #101211;border-radius:6px;background:#3a4b2a;font-size:11px}.track-lane button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-lane small{display:block;white-space:nowrap;color:#d9e9ca;font-size:10px}.track-lane.dialogue button{background:#304559}.track-lane.ambience button{background:#344d45}.track-lane.effect button{background:#654a30}.track-lane.music button{background:#4b395d}.track-lane.visual button{background:#574432}.track-lane button.muted-cue{opacity:.4}.mix-screen{height:180px;background:#090c08;display:grid;place-items:center;overflow:hidden;border-radius:9px}.mix-screen img,.mix-screen video,.mix-sketch{max-height:180px;width:100%;height:100%;object-fit:contain}.mix-sketch{position:relative;color:#d7ec9a}.mix-sketch svg{height:100%;width:100%}.mix-sketch p{position:absolute;bottom:12px;left:20px}
